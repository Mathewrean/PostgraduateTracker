# Render.com — deploy the WHOLE app (frontend + backend + worker + redis + postgres)
# from a single repo and a single free account. No Vercel needed.
#
# One-platform plan:
#   - Web Service -> Django API + React SPA (SPA is built in build.sh and served by
#                    Django/WhiteNoise at /, API at /api/*)  -> same origin, no CORS
#   - Redis       -> Celery broker/results (declared as a service; free tier has no
#                    background worker, so Celery tasks queue but aren't consumed)
#   - PostgreSQL  -> primary database (declared under databases:, NOT services:)
#
# Free-tier caveats: services spin down after 15 min idle (cold start ~30-60s),
# and the free Postgres/Redis have usage caps. Fine for demos / small use.

services:
  - type: web
    name: pst-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: pst-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CELERY_WORKER_ENABLED
        value: "false"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pst-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pst-redis
          property: connectionString

  - type: redis
    name: pst-redis
    plan: free
    ipAllowList: []

databases:
  - name: pst-db
    plan: free
    databaseName: pst
    user: pst
