# Render.com — deploy the WHOLE app (frontend + backend + worker + redis + postgres)
# from a single repo and a single free account. No Vercel needed.
#
# One-platform plan:
#   - Static Site  -> React SPA (frontend/) served from the same *.onrender.com domain
#   - Web Service  -> Django API (backend/)  on  /api/*
#   - Worker       -> Celery
#   - Redis        -> Celery broker/results
#   - PostgreSQL   -> primary database
#
# Free-tier caveats: services spin down after 15 min idle (cold start ~30-60s),
# and the free Postgres/Redis have usage caps. Fine for demos / small use.

staticSites:
  - name: pst-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    outputDirectory: dist
    # Use a backend-relative API path so the SPA calls the same origin (no CORS needed).
    # If you prefer an explicit URL, set VITE_API_URL instead (Render env var on this site).
    envVars:
      - key: VITE_API_URL
        value: "/api"
    routes:
      - source: /((?!api|_vercel|.*\\..*).*)
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

services:
  - type: web
    name: pst-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn pst_project.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: pst-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,pst-api.onrender.com,pst-frontend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pst-frontend.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pst-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pst-redis
          property: connectionString

  - type: worker
    name: pst-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: bash build.sh
    startCommand: celery -A pst_project worker -l info
    envVars:
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: pst-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pst-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pst-redis
          property: connectionString

  - type: redis
    name: pst-redis
    plan: starter
    ipAllowList: []

  - type: postgres
    name: pst-db
    plan: starter
    databaseName: pst
    user: pst
