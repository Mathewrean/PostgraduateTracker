# Render.com deployment config for the Django backend.
# NOTE: Vercel is for the React frontend ONLY. The Django API + Celery + Redis + Postgres
# must run on a server runtime host like Render, Railway, or Fly.io. Vercel's Python
# serverless builder cannot run a long-lived Django/Gunicorn/Celery app and does not
# reliably install native wheels (psycopg2/psycopg), which is why `collectstatic` fails there.

services:
  - type: web
    name: pst-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn pst_project.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: pst-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".vercel.app,.onrender.com,pst-api.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pst-tracker.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pst-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pst-redis
          property: connectionString

  - type: worker
    name: pst-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: bash build.sh
    startCommand: celery -A pst_project worker -l info
    envVars:
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: pst-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: pst-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: pst-redis
          property: connectionString

  - type: redis
    name: pst-redis
    plan: starter
    ipAllowList: []

  - type: postgres
    name: pst-db
    plan: starter
    databaseName: pst
    user: pst
